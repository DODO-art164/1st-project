name: Static site quality

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

concurrency:
  group: static-site-quality
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check browser JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -not -path './functions/*' -print0 | xargs -0 -r -n1 node --check

      - name: Check Cloudflare middleware syntax
        run: node --input-type=module --check < functions/_middleware.js

      - name: Check links, IDs, metadata, performance guards and AdSense files
        run: node scripts/static-check.mjs
