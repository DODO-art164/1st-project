name: FashionOps Quality

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fashionops-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run site checks
        run: node scripts/static-check.mjs
      - name: Run community checks
        run: node scripts/community-check.mjs
